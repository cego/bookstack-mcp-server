name: Image

# Builds the Docker image for a v* tag, smoke-tests it, then pushes it to GHCR.
# Tags release-please creates with GITHUB_TOKEN trigger nothing: run `gh workflow run image.yml --ref <tag>`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match the Dockerfile's BUN_IMAGE; the smoke suite fails if they differ.
  BUN_VERSION: 1.3.14
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, smoke and push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Assert the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}; the image would report the wrong version." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bookstack-mcp-server:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke the image
        run: bun test tests/transport/docker-smoke.test.ts
        env:
          RUN_DOCKER_SMOKE: '1'
          DOCKER_SMOKE_IMAGE: bookstack-mcp-server:ci
          RUN_INTEGRATION: '0'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the builder cache above, so the pushed layers are the ones just smoked.
      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
